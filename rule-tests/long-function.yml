JavaScript:
  invalid:
    - |
      function f(a) {
        const b = a + 1;
        const c = b + 1;
        const d = c + 1;
        const e = d + 1;
        const g = e + 1;
        const h = g + 1;
        const i = h + 1;
        return i;
      }
  valid:
    - |
      function f(a) {
        const b = a + 1;
        const c = b + 1;
        const d = c + 1;
        const e = d + 1;
        const g = e + 1;
        const h = g + 1;
        return h;
      }
