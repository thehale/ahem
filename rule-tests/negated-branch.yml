JavaScript:
  invalid:
    - |
      if (!ready) {
        wait();
      } else {
        go();
      }
    - |
      if (state !== "done") {
        wait();
      } else {
        go();
      }
  valid:
    - |
      if (ready) {
        go();
      } else {
        wait();
      }
    - |
      if (!ready) {
        wait();
      }
Python:
  invalid:
    - |
      if not ready:
          wait()
      else:
          go()
  valid:
    - |
      if ready:
          go()
      else:
          wait()
