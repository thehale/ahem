Bash:
  invalid:
    - |
      if ! ready; then
        wait
      else
        go
      fi
    - |
      if [[ $state != done ]]; then
        wait
      else
        go
      fi
  valid:
    - |
      if ready; then
        go
      else
        wait
      fi
    - |
      if ! ready; then
        wait
      fi
C:
  invalid:
    - |
      void f() {
        if (!ready) {
          wait();
        } else {
          go();
        }
      }
    - |
      void f() {
        if (state != done) {
          wait();
        } else {
          go();
        }
      }
  valid:
    - |
      void f() {
        if (ready) {
          go();
        } else {
          wait();
        }
      }
    - |
      void f() {
        if (!ready) {
          wait();
        }
      }
