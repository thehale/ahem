C:
  invalid:
    - |
      int f(int a, int b) {
        int result = 0;
        if (a != b) {
          result = 1;
        }
        return result;
      }
  valid:
    - |
      int f(int a, int b) {
        return a != b;
      }
    - |
      int f(int a, int n) {
        int total = 0;
        for (int i = 0; i < n; i++) {
          total = total + i;
        }
        return total;
      }
