JavaScript:
  invalid:
    - |
      function f(a, b) {
        let result = false;
        if (a !== b) {
          result = true;
        }
        return result;
      }
    - |
      function f(a, b) {
        let result = true;
        if (a !== b) {
          result = false;
        }
        return result;
      }
    - |
      function f(a, b) {
        let count = 0;
        if (a !== b) {
          count = 1;
        }
        return count;
      }
    - |
      function f(a, b) {
        let label;
        if (a !== b) {
          label = "differs";
        } else {
          label = "matches";
        }
        return label;
      }
  valid:
    - |
      function f(a, b) {
        return a !== b;
      }
    - |
      function f(a) {
        let total = 0;
        for (const x of a) {
          total = total + x;
        }
        return total;
      }
