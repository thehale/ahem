C:
  invalid:
    - |
      bool f(int n) {
        if (n > 0) {
          return true;
        } else {
          return false;
        }
      }
  valid:
    - |
      bool f(int n) {
        return n > 0;
      }
    - |
      int f(int n) {
        if (n > 0) {
          return n;
        } else {
          return 0;
        }
      }
