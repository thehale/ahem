C:
  invalid:
    - "void g() { f(true); }"
  valid:
    - "void g() { f(retry); }"
    - "void g() { bool retry = true; }"
Cpp:
  invalid:
    - "void g() { f(false); }"
  valid:
    - "void g() { f(retry); }"
CSharp:
  invalid:
    - "class A { void G() { F(true); } }"
  valid:
    - "class A { void G() { F(Retry); } }"
    - "class A { bool retry = true; }"
Dart:
  invalid:
    - "void g() { f(true); }"
  valid:
    - "void g() { f(retry); }"
    - "var retry = true;"
Elixir:
  invalid:
    - "f(true)"
  valid:
    - "f(retry)"
    - "enabled = true"
Go:
  invalid:
    - |
      package m
      func g() { f(true) }
  valid:
    - |
      package m
      func g() { f(retry) }
    - |
      package m
      var retry = true
Hcl:
  invalid:
    - "a = f(true)"
  valid:
    - "a = f(retry)"
    - "a = true"
Java:
  invalid:
    - "class A { void g() { f(true); } }"
  valid:
    - "class A { void g() { f(RETRY); } }"
    - "class A { boolean retry = true; }"
JavaScript:
  invalid:
    - "save(true);"
  valid:
    - "save(retry);"
    - "const retry = true;"
Kotlin:
  invalid:
    - "fun g() { f(true) }"
  valid:
    - "fun g() { f(retry) }"
    - "val retry = true"
Lua:
  invalid:
    - "f(true)"
  valid:
    - "f(retry)"
    - "local retry = true"
Nix:
  invalid:
    - "f true"
  valid:
    - "f retry"
    - "{ retry = true; }"
Php:
  invalid:
    - |
      <?php
      f(true);
  valid:
    - |
      <?php
      f($retry);
    - |
      <?php
      $retry = true;
Python:
  invalid:
    - "save(True)"
  valid:
    - "save(retry)"
    - "retry = True"
Ruby:
  invalid:
    - "save(true)"
  valid:
    - "save(retry)"
    - "enabled = true"
Rust:
  invalid:
    - "fn g() { save(true); }"
  valid:
    - "fn g() { save(retry); }"
    - "fn g() -> bool { Ok(true) }"
    - "fn g() { let retry = true; }"
Scala:
  invalid:
    - "object A { def g() = f(true) }"
  valid:
    - "object A { def g() = f(retry) }"
    - "object A { val retry = true }"
Solidity:
  invalid:
    - "contract A { function g() public { f(true); } }"
  valid:
    - "contract A { function g() public { f(retry); } }"
Swift:
  invalid:
    - "f(true)"
  valid:
    - "f(retry)"
    - "let retry = true"
Tsx:
  invalid:
    - "save(true);"
  valid:
    - "save(retry);"
TypeScript:
  invalid:
    - "save(true);"
  valid:
    - "save(retry);"
