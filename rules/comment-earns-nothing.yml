id: comment-earns-nothing
severity: warning
message: |-
  Default to no comments. What one carries belongs:
  - in a name, when it says what the code is
  - in a test, when it asserts what the code does
  - in the README, when a reader needs it before any code
  - in the commit message, when it is rationale
rule:
  any:
    - kind: comment
except:
  any:
    - regex: Copyright
    - regex: SPDX-License-Identifier
    - regex: "Usage:"
    - regex: "Examples:"
    - regex: '^(?:[ \t]*(?:/\*[*!]|\*/|//[/!]|\*)?[ \t]*(?:[@\\]\w+.*|-[ \t]+[A-Za-z]\w*(?:[ \t]+[A-Za-z]\w*)?[ \t]*:.*|</?(?:param|returns|typeparam|exception)[^\w].*)?[ \t]*(?:\r?\n|$))+$'
    - regex: "^\\W+$"
    - regex: "@ts-"
    - regex: "//go:"
    - regex: "biome-ignore"
    - regex: "codespell"
    - regex: "detekt"
    - regex: "eslint"
    - regex: "ktlint"
    - regex: "mypy"
    - regex: "noqa"
    - regex: "nolint"
    - regex: "prettier-ignore"
    - regex: "pylint"
    - regex: "pyright"
    - regex: "rubocop"
    - regex: "shellcheck"
    - regex: "stylelint"
    - regex: "swiftlint"
    - regex: "type: ignore"
languages:
  Rust:
    any:
      - kind: line_comment
      - kind: block_comment
  Kotlin:
    any:
      - kind: line_comment
      - kind: multiline_comment
  Java:
    any:
      - kind: line_comment
      - kind: block_comment
  Scala:
    any:
      - kind: comment
      - kind: block_comment
  Swift:
    any:
      - kind: comment
      - kind: multiline_comment
  Bash:
    except:
      regex: "^#!"
  Yaml:
    except:
      regex: '^#[ \t]*v?\d+(\.\d+)*$'
