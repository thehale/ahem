id: comment-earns-nothing
severity: warning
message: |-
  Default to no comments. What one carries belongs:
  - nowhere, when the code beside it already says it
  - in a name, when it says what the code is
  - in a test, when it asserts what the code does
  - in the README, when a reader needs it before any code
  - in the commit message, when it is rationale
rule:
  any:
    - kind: comment
except:
  any:
    - regex: Copyright
    - regex: SPDX-License-Identifier
    - regex: "Usage:"
    - regex: "Examples:"
    - regex: "^\\W+$"
    - regex: "@ts-"
    - regex: "//go:"
    - regex: "\\$Flow"
    - regex: "@codingStandardsIgnore"
    - regex: "@diagnostic"
    - regex: "@phpstan-ignore"
    - regex: "@psalm-suppress"
    - regex: '^//\s*ignore(_for_file)?:'
    - regex: '^<!--\s*vale\s'
    - regex: "biome-ignore"
    - regex: "checkov:"
    - regex: "CHECKSTYLE"
    - regex: "codespell"
    - regex: "cppcheck-suppress"
    - regex: "credo:"
    - regex: "deno-lint-ignore"
    - regex: "detekt"
    - regex: "eslint"
    - regex: "kics-scan"
    - regex: "ktlint"
    - regex: "lint:file-ignore"
    - regex: "lint:ignore"
    - regex: "luacheck"
    - regex: "markdownlint"
    - regex: "mypy"
    - regex: "noinspection"
    - regex: "NOLINT"
    - regex: "nolint"
    - regex: "NOPMD"
    - regex: "noqa"
    - regex: "nosec"
    - regex: "oxlint"
    - regex: "periphery:"
    - regex: "phpcs:"
    - regex: "prettier-ignore"
    - regex: "pylint"
    - regex: "pyre-"
    - regex: "pyrefly"
    - regex: "pyright"
    - regex: "pytype"
    - regex: "ReSharper"
    - regex: "rubocop"
    - regex: "scalafix"
    - regex: "scalastyle"
    - regex: "selene:"
    - regex: "shellcheck"
    - regex: "slither-"
    - regex: "solhint-"
    - regex: "standard:disable"
    - regex: "stylelint"
    - regex: "swiftlint"
    - regex: "textlint-"
    - regex: "tflint-ignore"
    - regex: "tfsec:"
    - regex: "trivy:"
    - regex: "tslint:"
    - regex: "type: ignore"
    - regex: "yamllint"
    - regex: "zizmor:"
languages:
  C:
    except: &tags
      all:
        - regex: '^/\*\*[\s*]*[@\\]\w'
        - not:
            regex: '\n[ \t]*\*?[ \t]*\n[ \t]*\*?[ \t]*\w'
  Cpp:
    except: *tags
  CSharp:
    except:
      regex: '^///\s*</?(param|returns|typeparam|exception)\b'
  Kotlin:
    any:
      - kind: line_comment
      - kind: multiline_comment
    except: *tags
  Markdown:
    kind: html_block
    regex: "^<!--"
  Php:
    except: *tags
  Rust:
    any:
      - kind: line_comment
      - kind: block_comment
  Java:
    any:
      - kind: line_comment
      - kind: block_comment
  Scala:
    any:
      - kind: comment
      - kind: block_comment
    except: *tags
  Solidity:
    except:
      regex: '^///\s*@\w+'
  Swift:
    any:
      - kind: comment
      - kind: multiline_comment
    except:
      regex: '^///\s*- \w+( \w+)?:'
  Bash:
    except:
      regex: "^#!"
  javadoc:
    any:
      - kind: description
        inside:
          kind: document
      - kind: description
        regex: '\n[ \t]*\*?[ \t]*\n[ \t]*\*?[ \t]*\w'
  jsdoc:
    kind: description
    inside:
      kind: document
  Yaml:
    except:
      regex: '^#[ \t]*v?\d+(\.\d+)*$'
