id: comment-earns-nothing
severity: warning
message: |-
  Default to no comments. What one carries belongs:
  - nowhere, when the code beside it already says it
  - in a name, when it says what the code is
  - in a test, when it asserts what the code does
  - in the README, when a reader needs it before any code
  - in the commit message, when it is rationale
rule:
  any:
    - kind: comment
except:
  any:
    - regex: Copyright
    - regex: SPDX-License-Identifier
    - regex: "Usage:"
    - regex: "Examples:"
    - regex: "^\\W+$"
    - regex: "@ts-"
    - regex: "//go:"
    - regex: "biome-ignore"
    - regex: "codespell"
    - regex: "detekt"
    - regex: "eslint"
    - regex: "ktlint"
    - regex: "mypy"
    - regex: "noqa"
    - regex: "nolint"
    - regex: "prettier-ignore"
    - regex: "pylint"
    - regex: "pyright"
    - regex: "rubocop"
    - regex: "shellcheck"
    - regex: "stylelint"
    - regex: "swiftlint"
    - regex: "type: ignore"
languages:
  C:
    except: &tags
      all:
        - regex: '^/\*\*[\s*]*[@\\]\w'
        - not:
            regex: '\n[ \t]*\*?[ \t]*\n[ \t]*\*?[ \t]*\w'
  Cpp:
    except: *tags
  CSharp:
    except:
      regex: '^///\s*</?(param|returns|typeparam|exception)\b'
  Kotlin:
    any:
      - kind: line_comment
      - kind: multiline_comment
    except: *tags
  Php:
    except: *tags
  Rust:
    any:
      - kind: line_comment
      - kind: block_comment
  Java:
    any:
      - kind: line_comment
      - kind: block_comment
  Scala:
    any:
      - kind: comment
      - kind: block_comment
    except: *tags
  Solidity:
    except:
      regex: '^///\s*@\w+'
  Swift:
    any:
      - kind: comment
      - kind: multiline_comment
    except:
      regex: '^///\s*- \w+( \w+)?:'
  Bash:
    except:
      regex: "^#!"
  javadoc: &summary
    kind: description
    inside:
      kind: document
  jsdoc: *summary
  Yaml:
    except:
      regex: '^#[ \t]*v?\d+(\.\d+)*$'
