id: name-carries-no-content
severity: warning
message: >-
  A name like data, result or value tells the reader nothing the line does not
  already say. Name it for what it holds, such as user or total.
rule:
  kind: identifier
  any: &contentless
    - regex: "^[$]?data$"
    - regex: "^[$]?result$"
    - regex: "^[$]?value$"
    - regex: "^[$]?item$"
    - regex: "^[$]?temp$"
    - regex: "^[$]?tmp$"
    - regex: "^[$]?obj$"
    - regex: "^[$]?info$"
    - regex: "^[$]?output$"
    - regex: "^[$]?written$"
    - regex: "^[$]?thing$"
    - regex: "^[$]?stuff$"
    - regex: "^[$]?foo$"
    - regex: "^[$]?bar$"
languages:
  Bash:
    kind: variable_name
    any: *contentless
  Kotlin:
    kind: simple_identifier
    any: *contentless
  Php:
    kind: variable_name
    any: *contentless
  Swift:
    kind: simple_identifier
    any: *contentless
