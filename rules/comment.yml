id: comment-earns-nothing
severity: warning
message: >-
  Default to no comments. A well named helper is the comment, and rationale belongs in the commit message where it cannot drift from the code.
rule:
  any:
    - kind: comment
except:
  any:
    - regex: Copyright
    - regex: SPDX-License-Identifier
    - regex: "@ts-"
    - regex: "//go:"
    - regex: "biome-ignore"
    - regex: "codespell"
    - regex: "detekt"
    - regex: "eslint"
    - regex: "ktlint"
    - regex: "mypy"
    - regex: "noqa"
    - regex: "nolint"
    - regex: "prettier-ignore"
    - regex: "pylint"
    - regex: "pyright"
    - regex: "rubocop"
    - regex: "shellcheck"
    - regex: "stylelint"
    - regex: "swiftlint"
    - regex: "type: ignore"
languages:
  Rust:
    any:
      - kind: line_comment
      - kind: block_comment
  Kotlin:
    any:
      - kind: line_comment
      - kind: multiline_comment
  Java:
    any:
      - kind: line_comment
      - kind: block_comment
  Scala:
    any:
      - kind: comment
      - kind: block_comment
  Swift:
    any:
      - kind: comment
      - kind: multiline_comment
  Bash:
    except:
      regex: "^#!"
