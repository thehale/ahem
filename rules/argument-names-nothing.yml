id: argument-names-nothing
severity: hint
message: >-
  A bare true or false at a call site leaves the reader to open the function to learn what it selects. A named value, or two functions, carries the meaning to the call.
rule:
  all:
    - any: &literal
        - pattern: "true"
        - pattern: "false"
    - inside:
        kind: arguments
languages:
  C:
    all:
      - any: &keyword
          - kind: "true"
          - kind: "false"
      - inside:
          kind: argument_list
  Cpp:
    all:
      - any: *keyword
      - inside:
          kind: argument_list
  CSharp:
    all:
      - kind: boolean_literal
      - inside:
          kind: argument
          not:
            has:
              field: name
              kind: identifier
  Dart:
    all:
      - any: *keyword
      - inside:
          kind: arguments
  Elixir:
    all:
      - kind: boolean
      - inside:
          kind: arguments
  Go:
    all:
      - any: *literal
      - inside:
          kind: argument_list
  Hcl:
    all:
      - kind: bool_lit
      - inside:
          kind: literal_value
          inside:
            kind: expression
            inside:
              kind: function_arguments
  Java:
    all:
      - any: *keyword
      - inside:
          kind: argument_list
  Kotlin:
    all:
      - kind: boolean_literal
      - inside:
          kind: value_argument
          not:
            has:
              kind: simple_identifier
  Lua:
    all:
      - any: *keyword
      - inside:
          kind: arguments
  Nix:
    all:
      - kind: variable_expression
      - regex: "^(true|false)$"
      - inside:
          kind: apply_expression
          field: argument
  Php:
    all:
      - kind: boolean
      - inside:
          kind: argument
          not:
            has:
              field: name
              kind: name
  Python:
    all:
      - any:
          - pattern: "True"
          - pattern: "False"
      - inside:
          kind: argument_list
  Ruby:
    all:
      - any: *literal
      - inside:
          kind: argument_list
  Rust:
    all:
      - kind: boolean_literal
      - inside:
          kind: arguments
          inside:
            kind: call_expression
            not:
              has:
                field: function
                regex: ^(Ok|Err|Some)$
  Scala:
    all:
      - kind: boolean_literal
      - inside:
          kind: arguments
  Solidity:
    all:
      - kind: boolean_literal
      - inside:
          kind: expression
          inside:
            kind: call_argument
  Swift:
    all:
      - kind: boolean_literal
      - inside:
          kind: value_argument
          not:
            has:
              field: name
              kind: value_argument_label
