id: variable-renames-field
severity: hint
message: >-
  The reader has to trace this variable back to the field it copies.
rule:
  all:
    - kind: variable_definition
    - has:
        field: variable
        has:
          field: name
          pattern: _N
    - has:
        field: value
        kind: field
        has:
          field: name
          pattern: _N
    - inside:
        any:
          - kind: template
          - kind: define_action
          - kind: block_action
        not:
          has:
            stopBy: end
            kind: assignment
            has:
              field: variable
              has:
                field: name
                pattern: _N
languages:
  gotmpl:
    addendum: >-
      Reach the field through `$` instead, as in `$.image.Width`.
